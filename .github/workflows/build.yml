# This workflow will install Python dependencies and run the tests
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GHACTIONS: ACTIVE

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Set up an emulator so images built for another processor family run
      uses: docker/setup-qemu-action@v3
    - name: Check out the paper repository for its use case examples
      uses: actions/checkout@v6
      with:
        repository: WolfgangFahl/pyomnigraphPaper
        path: pyomnigraphPaper
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        scripts/install
    - name: Run tests
      env:
        PYOMNIGRAPH_EXAMPLES: ${{ github.workspace }}/pyomnigraphPaper/examples/railway/dumps
      run: |
        scripts/test
