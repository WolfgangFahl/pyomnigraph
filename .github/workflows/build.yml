# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GHACTIONS: ACTIVE

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest] 
        os: [ubuntu-latest]
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up QEMU so images built for another architecture can run
      uses: docker/setup-qemu-action@v3
    - name: Check out the paper repository for its use case examples
      uses: actions/checkout@v6
      with:
        repository: WolfgangFahl/pyomnigraphPaper
        path: pyomnigraphPaper
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        scripts/install
    - name: Run tests
      env:
        PYOMNIGRAPH_EXAMPLES: ${{ github.workspace }}/pyomnigraphPaper/examples/railway/dumps
      run: |
        scripts/test
